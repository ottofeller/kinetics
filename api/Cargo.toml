[package]
name = "kinetics-api"
version = "0.16.11"
edition = "2021"
description = "Shared API request and response types for Kinetics."
repository = "https://github.com/ottofeller/kinetics"
license = "Apache-2.0 OR MIT"
keywords = ["kinetics", "api", "types"]
categories = ["api-bindings"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
humantime = "2.3.0"
kinetics-parser = { path = "../parser", version = "0.16.10" }
once_cell = "1.21.4"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
