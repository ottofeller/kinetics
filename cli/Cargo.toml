[package]
name = "kinetics"
version = "0.16.8"
edition = "2021"
description = "Kinetics is a hosting platform for Rust applications that allows you to deploy all types of workloads by writing **only Rust code**."
readme = "../README.md"
repository = "https://github.com/ottofeller/kinetics"
license = "Apache-2.0 OR MIT"
keywords = ["deployment", "development", "hosting", "kinetics", "platform"]
categories = ["command-line-utilities"]

[[bin]]
name = "kinetics"
path = "src/main.rs"

[dependencies]
time = "=0.3.47"
async-trait = "0.1.89"
aws-config = "1.8.15"
aws_lambda_events = "1.1.2"
aws-sdk-dsql = "1.54.0"
aws-sdk-dynamodb = "1.110.0"
aws-sdk-sqs = "1.97.0"
base64 = "0.22.1"
bytes = "^1.0"
cargo_metadata = "0.23.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
color-eyre = "0.6.5"
console = "0.16.3"
crc-fast = "^1.6.0"  # Lock the lower version while as the higher one conflicts with AWD SDK crates
crossterm = "0.29.0"
env_logger = "0.11.10"
eyre = "0.6.12"
futures = "0.3.32"
http = "^1.0"
http-body = "^1.0"
humantime = "2.3.0"
indicatif = "0.18.4"
indicatif-log-bridge = "0.2.3"
keyring = { version = "3.6.3", features = [
  "apple-native",
  "sync-secret-service",
  "vendored",
  "windows-native"
] }
kinetics-macro = { path = "../macro", version = "0.16.8" }
kinetics-parser = { path = "../parser", version = "0.16.8" }
lambda_http = "^1.0"
lambda_runtime = "^1.0"
log = "0.4.29"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
prettyplease = "0.2.37"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = [
  "default-tls",
  "blocking",
  "json",
] }
rust_dotenv = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.23"
sha256 = "1.6.0"
sqlparser = "0.61.0"
sqlx = { version = "0.8.6", features = [
  "chrono",
  "postgres",
  "runtime-tokio-rustls",
] }
syn = { version = "2.0", features = ["full", "visit"] }
tabled = "0.20.0"
terminal_size = "0.4.4"
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
toml_edit = "0.25.11+spec-1.1.0"
tower = "^0"
twox-hash = "2.1.2"
url = "2.5.8"
users = "0.11.0"
walkdir = "2.5.0"
