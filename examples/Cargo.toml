[package]
name = "examples"
version = "0.9.2"
edition = "2021"

[dependencies]
http = "^1.0"
kinetics = { path = "../cli" }
matchit = "0.9.2"
opentelemetry = { version = "0.31.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = { version = "0.31.1" }
opentelemetry-otlp = { version = "0.31.1", features = [
  "grpc-tonic",
  "http-json",
  "http-proto",
  "internal-logs",
  "logs",
  "metrics",
  "opentelemetry-http",
  "trace"
] }
opentelemetry_sdk = { version = "0.31.0", features = [
  "logs",
  "metrics",
  "trace"
] }
serde_json = { version = "1.0.149", features = ["default"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls"] }
tokio = "1.51.1"
tower = "^0"
tracing = { version = "0.1.44", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "registry",
  "std",
  "tracing-log"
] }
