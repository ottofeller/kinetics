name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  check:
    name: Check workspace
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check workspace
        uses: ./.github/actions/check-workspace

      - name: Resolve release tag
        id: release
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -er '.packages[] | select(.name == "kinetics") | .version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release archive
        id: build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kinetics
          package: kinetics
          target: ${{ matrix.target }}
          # Used for the archive name; builds the checked-out SHA without requiring the tag to exist.
          ref: refs/tags/${{ needs.check.outputs.tag }}
          locked: true
          archive: "$bin-$tag-$target"
          checksum: sha256
          dry-run: true
          dry-run-intended: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kinetics-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.tar }}
            ${{ steps.build.outputs.sha256 }}
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create draft release
    needs: [check, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout release history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: kinetics-*
          merge-multiple: true
          path: dist

      - name: Create tag and draft with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" HEAD)

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_sha=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG points to $tag_sha, but this workflow is building $GITHUB_SHA." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi

          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes --notes-start-tag "$previous_tag"
