[package]
name = "kinetics"
version.workspace = true
edition = "2021"
description = "Runtime helpers and macros for Kinetics applications."
readme = "../README.md"
repository = "https://github.com/ottofeller/kinetics"
license = "Apache-2.0 OR MIT"
keywords = ["deployment", "development", "hosting", "kinetics", "platform"]
categories = ["development-tools"]

[dependencies]
aws-config = "1.8.15"
aws_lambda_events = "1.1.2"
aws-sdk-dsql = "1.54.0"
aws-sdk-sqs = "1.97.0"
bytes = "^1.0"
eyre = "0.6.12"
http-body = "^1.0"
kinetics-macro.workspace = true
kinetics-parser.workspace = true
lambda_http = "^1.0"
lambda_runtime = "^1.0"
log = "0.4.29"
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
sha256 = "1.6.0"
tokio = { workspace = true, features = ["full"] }
tower = "^0"
url = "2.5.8"
